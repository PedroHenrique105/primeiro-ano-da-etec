<script>
    //laço de repetição para ler o vetor A
    let vetorA=[];
     for(let i=0; i<10;i++){
        vetorA[i] = parseInt((prompt("Entre com o "+(i+1)+"o. valor de A:")));
      }
        
    //laço de repetição para ler o vetor B
    let vetorB =[];
    for(let i=0; i<10;i++){
        vetorB[i] = parseInt((prompt("Entre com o "+(i+1)+"o. valor de B:")));
      }

    // 2. Criação de um vetor C vazio para armazenar os resultados
    let vetorC = [];

    // 3. Laço de repetição para somar os elementos de mesma posição (índice)
    for (let i = 0; i < 10; i++) {
        
        vetorC[i] = (vetorA[i] + vetorB[i]);
    }

    // 4. Exibição dos resultados no console
    document.write("Vetor A: ", vetorA+"<br><br>");
    document.write("Vetor B: ", vetorB+"<br> <br>");
    document.write("<br>Vetor C (Soma): ", vetorC);
</script>
